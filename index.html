<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Undangan Pernikahan - Icha & Eming</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- PRELOADER -->
    <div id="preloader">
      <div class="preloader-content">
        <div class="preloader-initials">I & E</div>
        <div class="preloader-line"></div>
      </div>
    </div>

    <main class="container">
      <section class="hero">
        <!-- Background bunga utama -->
        <div class="flower-background" aria-hidden="true"></div>

        <!-- Judul -->
        <header class="cover-heading anim-pop">
          <p class="the-wedding">THE WEDDING OF</p>
          <h1 class="title">
            Icha <span class="and-symbol">&amp;</span> Eming
          </h1>
        </header>

        <!-- Foto pasangan -->
        <div class="cover-photo anim-pop">
          <img src="./assets/bg.png" alt="Icha dan Eming" />
        </div>

        <!-- Informasi tamu -->
        <div class="invitation-box anim-pop">
          <p class="to">
            Kepada Yth:<br />
            Bapak/Ibu/Saudara/i
          </p>

          <div class="guest-name-box">
            <p class="name" id="guestName">Tamu Undangan</p>
          </div>
        </div>

        <!-- Tombol undangan -->
        <button id="openBtn" type="button" class="anim-pop">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m22 6-10 7L2 6" />
          </svg>
          Buka Undangan
        </button>

        <!-- RUMAH ADAT BUGIS -->
        <img
          class="bugis-house"
          src="./assets/Ornate Bugis Stilt House Isolated.png"
          alt=""
          aria-hidden="true"
        />

        <!-- Tombol musik -->
        <button id="soundToggle" type="button" aria-label="Atur musik"></button>
      </section>
    </main>

    <!-- JavaScript asli -->
    <script src="./Index.js"></script>

    <script>
      const params = new URLSearchParams(window.location.search);

      const namaTamu = params.get("to");

      document.getElementById("guestName").textContent =
        namaTamu && namaTamu.trim() ? namaTamu.trim() : "Tamu Undangan";
    </script>
  </body>
</html>
